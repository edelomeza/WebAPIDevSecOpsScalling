name: Deploy to AWS (Manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag (sha) ya publicado por ci-cd.yml (default github.sha)
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy webapidevsecops-prod
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure AWS credentials (GH Secrets env)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy infra (cloudformation deploy + wait nativo)
        run: bash scripts/deploy-aws.sh webapidevsecops-prod "${{ inputs.tag || github.sha }}"
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          CORS_ALLOWED_ORIGIN: ${{ vars.CORS_ALLOWED_ORIGIN }}
          ACM_CERTIFICATE_ARN: ${{ vars.ACM_ARN }}

      - name: Deploy app via SSM (sin 22/pem)
        run: bash scripts/deploy-app.sh webapidevsecops-prod "${{ inputs.tag || github.sha }}"
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_USER: ${{ secrets.DB_USER }}
          JWT_KEY_PROD: ${{ secrets.JWT_KEY_PROD }}
          CORS_ALLOWED_ORIGIN: ${{ vars.CORS_ALLOWED_ORIGIN }}

      - name: Smoke health check
        run: |
          ALBDNS=$(aws cloudformation describe-stacks --stack-name webapidevsecops-prod --region "${{ vars.AWS_REGION || 'us-east-1' }}" --query "Stacks[0].Outputs[?OutputKey=='ALBDNS'].OutputValue" --output text)
          echo "ALBDNS=$ALBDNS"
          curl -sf "http://$ALBDNS/health/ready" | head -c 500
          echo "Smoke OK"
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
