services:
  redis:
    build:
      context: ./redis-chaos
    ports: ["6379:6379"]
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru

  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "yourStrong(!)Password"
      MSSQL_PID: Developer
    ports: ["1433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports: ["8080:8080"]
    depends_on:
      redis:
        condition: service_started
      sql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sql,1433;Database=WebAPIDevSecOps;User Id=sa;Password=yourStrong(!)Password;TrustServerCertificate=True"
      Redis__ConnectionString: "redis:6379"
      Jwt__Key: "chaos-nightly-secret-key-0123456789abcdef0123456789abcdef"
      Jwt__Issuer: "https://localhost:7227"
      Jwt__Audience: "https://localhost:7227/api"
      EnableProviderStates: "true"
      Observability__ConsoleExport: "false"
      RateLimiting__GlobalPermitLimit: "100000"
      RateLimiting__LoginPermitLimit: "100000"
      RateLimiting__Login2faVerifyPermitLimit: "100000"
      RateLimiting__AdminPermitLimit: "100000"
